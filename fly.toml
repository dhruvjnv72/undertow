# Fly.io config (https://fly.io): `fly launch --copy-config --no-deploy`, then `fly secrets set UNDERTOW_RPC=...`, then `fly deploy`.
# UNTESTED TEMPLATE: written from Fly's documented format but never run by the author.
app = "undertow-REPLACE-ME"   # must be globally unique
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.fast"   # prebuilt Perpl CLI, builds in about a minute

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # keep it running so the data feed and live WebSocket stay up
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
