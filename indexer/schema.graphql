type Account {
  id: ID!
  chainId: Int!
  accountId: Int!
  address: String!
  createdBlock: Int!
  createdAt: Int!
}

# One row per resting-order fill (every trade has exactly one maker side), so summing notionalUsd gives volume.
type Trade {
  id: ID!
  chainId: Int!
  perpId: Int!
  perpName: String!
  makerAccountId: Int!
  price: Float!
  size: Float!
  notionalUsd: Float!
  makerFeeUsd: Float!
  block: Int!
  timestamp: Int!
}

type Liquidation {
  id: ID!
  chainId: Int!
  perpId: Int!
  perpName: String!
  accountId: Int!
  side: String!
  markPrice: Float!
  liqPrice: Float!
  liquidatedSize: Float!
  remainingSize: Float!
  notionalUsd: Float!
  onOrderBook: Boolean!
  block: Int!
  timestamp: Int!
}

type Deleverage {
  id: ID!
  chainId: Int!
  perpId: Int!
  perpName: String!
  accountId: Int!
  side: String!
  forceClose: Boolean!
  markPrice: Float!
  deleveragePrice: Float!
  closedSize: Float!
  block: Int!
  timestamp: Int!
}

type CashFlow {
  id: ID!
  chainId: Int!
  accountId: Int!
  kind: String!
  amountUsd: Float!
  block: Int!
  timestamp: Int!
}

type FundingEvent {
  id: ID!
  chainId: Int!
  perpId: Int!
  perpName: String!
  fundingBlock: Int!
  actualRatePct100k: Int!
  timestamp: Int!
}

type DailyStats {
  id: ID!
  chainId: Int!
  date: String!
  volumeUsd: Float!
  trades: Int!
  makerFeesUsd: Float!
  liquidations: Int!
  liquidatedUsd: Float!
  deleverages: Int!
  depositsUsd: Float!
  withdrawalsUsd: Float!
  newAccounts: Int!
}

type PerpDailyStats {
  id: ID!
  chainId: Int!
  perpId: Int!
  perpName: String!
  date: String!
  volumeUsd: Float!
  trades: Int!
  liquidations: Int!
  liquidatedUsd: Float!
}

# One row per position change of one account: the basis of a wallet's history, realized profit and win rate.
# kind: opened | increased | decreased | closed | flipped | liquidated | deleveraged
# realizedPnlUsd is the price profit realized by this change (the contract's deltaPnl); fundingPaidUsd is funding settled by it
# (positive = paid, from the SDK's own handling of PositionLiquidated). Some events do not carry every field, so those are null.
type PositionEvent {
  id: ID!
  chainId: Int!
  perpId: Int!
  perpName: String!
  accountId: Int!
  kind: String!
  side: String!
  price: Float
  sizeBefore: Float
  sizeAfter: Float
  leverage: Float
  realizedPnlUsd: Float
  fundingPaidUsd: Float
  block: Int!
  timestamp: Int!
}
