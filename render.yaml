# Render blueprint (https://render.com): deploys the Dockerfile as a web service.
# UNTESTED TEMPLATE: written from Render's documented format but never run by the author.
# The first build compiles Perpl's Rust CLI and can take 10 to 40 minutes.
services:
  - type: web
    name: undertow
    runtime: docker
    plan: starter            # "free" also works but sleeps after inactivity, which pauses the data feed
    healthCheckPath: /       # /api/status answers 503 until the first data refresh (about a minute)
    envVars:
      - key: UNDERTOW_RPC
        sync: false          # you enter it in the Render dashboard: your own Monad RPC URL (for example Alchemy)
